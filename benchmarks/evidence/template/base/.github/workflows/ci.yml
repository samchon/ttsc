name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  API_PORT: "37001"
  JWT_SECRET_KEY: ci-only-jwt-secret-key-at-least-32-characters
  JWT_ACCESS_TTL_SECONDS: "3600"
  JWT_REFRESH_TTL_SECONDS: "2592000"
  VITE_API_HOST: http://127.0.0.1:37001
  VITE_API_SIMULATE: "true"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Lint
        run: pnpm lint

      - name: Reset database
        run: pnpm schema:database

      - name: Test backend
        run: pnpm test:backend

      - name: Install Chromium
        run: pnpm --filter {{frontendPackageName}} exec playwright install --with-deps chromium

      - name: Test frontend
        run: pnpm test:frontend
