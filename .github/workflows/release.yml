name: release

on:
  push:
    tags: ["*"]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  id-token: write
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org/
      - uses: actions/setup-go@v7
        id: go
        with:
          go-version-file: packages/ttsc/go.mod
          cache: false
      - name: Locate Go caches
        id: go-cache
        shell: bash
        run: |
          printf 'modules=%s\n' "$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
          printf 'objects=%s\n' "$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
          printf 'GOCACHE=%s\n' "$(go env GOCACHE)" >> "$GITHUB_ENV"
          printf 'image=%s\n' "${ImageOS:-default}" >> "$GITHUB_OUTPUT"
          printf 'node-arch=%s\n' "$(node -p process.arch)" >> "$GITHUB_OUTPUT"
      - name: Cache Go modules and objects
        uses: actions/cache@v4
        with:
          path: |
            ${{ steps.go-cache.outputs.modules }}
            ${{ steps.go-cache.outputs.objects }}
          key: ttsc-go-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.go-cache.outputs.image }}-${{ steps.go.outputs.go-version }}-${{ github.workflow }}-${{ matrix.name || 'host' }}-${{ hashFiles('**/*.go', '**/go.mod', '**/go.sum', '**/go.work', '**/go.work.sum', 'package.json', 'packages/ttsc/package.json', 'packages/ttsc-*/package.json', 'packages/ttsc/build/**', 'packages/ttsc/driver/resolutioninputs/recorder.cjs', 'packages/ttsc/test/driver/fixtures/rewrite-runtime/**', 'packages/lint/linthost/polyfill_data_gen.json', 'packages/lint/linthost/rule_codes.json', 'pnpm-lock.yaml', '.github/workflows/release.yml') }}
          restore-keys: |
            ttsc-go-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.go-cache.outputs.image }}-${{ steps.go.outputs.go-version }}-${{ github.workflow }}-${{ matrix.name || 'host' }}-
            ttsc-go-full-build-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.go-cache.outputs.image }}-${{ steps.go.outputs.go-version }}-
            ttsc-go-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.go-cache.outputs.image }}-${{ steps.go.outputs.go-version }}-build-host-
            ttsc-go-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.go-cache.outputs.image }}-${{ steps.go.outputs.go-version }}-website-host-
            ttsc-go-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.go-cache.outputs.image }}-${{ steps.go.outputs.go-version }}-
            setup-go-${{ runner.os }}-${{ steps.go-cache.outputs.node-arch }}-${{ runner.os == 'Linux' && format('{0}-', steps.go-cache.outputs.image) || '' }}go-${{ steps.go.outputs.go-version }}-
      - run: pnpm install --frozen-lockfile
      - run: test "v$(node -p "require('./packages/ttsc/package.json').version")" = "$GITHUB_REF_NAME"
      - run: pnpm run build
      - run: pnpm --dir packages/vscode exec vsce publish --packagePath dist/ttsc-vscode-${GITHUB_REF_NAME#v}.vsix --no-dependencies --skip-duplicate
        continue-on-error: true
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
      - run: pnpm run package:latest:publish
      - run: pnpm dlx changelogithub
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
