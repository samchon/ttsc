name: release

on:
  push:
    tags: ["*"]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  id-token: write
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org/
      - uses: actions/setup-go@v7
        with:
          go-version-file: packages/ttsc/go.mod
          cache-dependency-path: "**/go.sum"
      - run: pnpm install --frozen-lockfile
      - run: test "v$(node -p "require('./packages/ttsc/package.json').version")" = "$GITHUB_REF_NAME"
      - run: pnpm run build
      - run: pnpm --dir packages/vscode exec vsce publish --packagePath dist/ttsc-vscode-${GITHUB_REF_NAME#v}.vsix --no-dependencies --skip-duplicate
        continue-on-error: true
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
      - run: pnpm run package:latest:publish
      - run: pnpm dlx changelogithub
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
