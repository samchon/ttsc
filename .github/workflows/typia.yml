name: typia

on: pull_request

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typia:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.6.4
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
      - uses: actions/setup-go@v7
        with:
          go-version-file: packages/ttsc/go.mod
          cache-dependency-path: "**/go.sum"
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter ttsc --filter @ttsc/unplugin --filter ./packages/ttsc-linux-x64 -r --workspace-concurrency=1 build
      - run: pnpm --filter ttsc --filter @ttsc/unplugin --filter ./packages/ttsc-linux-x64 exec pnpm pack --out "../../experimental/tarballs/%s.tgz"
      - uses: actions/checkout@v7
        with:
          repository: samchon/typia
          path: experimental/typia
      - run: git -C experimental/typia apply --directory=packages/typia "$GITHUB_WORKSPACE/experimental/native-host-provenance/typia.patch"
      - run: node .github/workflows/scripts/consumer.cjs experimental/typia
      - run: pnpm install --no-frozen-lockfile
        working-directory: experimental/typia
      - run: pnpm --filter "./tests/test-*" --fail-if-no-match --no-bail -r start
        working-directory: experimental/typia
      - run: pnpm run test:go:public && pnpm run test:go:native
        working-directory: experimental/typia
      - run: pnpm --dir experimental/source-map start -- --skip-pack --typia-master
