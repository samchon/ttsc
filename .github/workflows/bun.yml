name: bun

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/bun.yml"
      - "experimental/test-unplugin/**"
      - "experimental/tarballs/**"
      - "config/**"
      - "scripts/assert-platform-package.cjs"
      - "scripts/build-current.cjs"
      - "scripts/build-platform-package.cjs"
      - "scripts/go-build-cache.cjs"
      - "scripts/go-sdk-extraction.cjs"
      - "scripts/go-sdk-integrity.cjs"
      - "scripts/platform-target.cjs"
      - "packages/ttsc/**"
      - "packages/banner/**"
      - "packages/lint/**"
      - "packages/paths/**"
      - "packages/strip/**"
      - "packages/unplugin/**"
      - "packages/ttsc-*/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
  pull_request:
    paths:
      - ".github/workflows/bun.yml"
      - "experimental/test-unplugin/**"
      - "experimental/tarballs/**"
      - "config/**"
      - "scripts/assert-platform-package.cjs"
      - "scripts/build-current.cjs"
      - "scripts/build-platform-package.cjs"
      - "scripts/go-build-cache.cjs"
      - "scripts/go-sdk-extraction.cjs"
      - "scripts/go-sdk-integrity.cjs"
      - "scripts/platform-target.cjs"
      - "packages/ttsc/**"
      - "packages/banner/**"
      - "packages/lint/**"
      - "packages/paths/**"
      - "packages/strip/**"
      - "packages/unplugin/**"
      - "packages/ttsc-*/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
  workflow_dispatch:

concurrency:
  group: bun-${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  Unplugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24.x

      - uses: actions/setup-go@v7
        with:
          go-version-file: packages/ttsc/go.mod
          cache-dependency-path: |
            packages/ttsc/go.sum
            tests/go-transformer/go.mod

      - uses: pnpm/action-setup@v6
        with:
          version: 10.6.4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Unplugin With Bun Runtime
        run: pnpm run experimental:unplugin
