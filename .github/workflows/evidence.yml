name: evidence

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

concurrency:
  group: evidence-${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24.x

      - uses: pnpm/action-setup@v6
        with:
          version: 10.6.4

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Check Engineering Contracts
        run: pnpm evidence
