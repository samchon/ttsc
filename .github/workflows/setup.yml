name: setup

on: pull_request

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  setup:
    name: setup (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x64, runner: ubuntu-24.04 }
          - { name: linux-arm64, runner: ubuntu-24.04-arm }
          - { name: darwin-x64, runner: macos-15-intel }
          - { name: darwin-arm64, runner: macos-15 }
          - { name: win32-x64, runner: windows-2025 }
          - { name: win32-arm64, runner: windows-11-arm }
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.6.4
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: pnpm
      - uses: actions/setup-go@v7
        id: go
        with:
          go-version-file: packages/ttsc/go.mod
          cache: false
      - name: Locate Go caches
        id: go-cache
        shell: bash
        run: |
          printf 'modules=%s\n' "$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
          printf 'objects=%s\n' "$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
          printf 'GOCACHE=%s\n' "$(go env GOCACHE)" >> "$GITHUB_ENV"
          printf 'image=%s\n' "${ImageOS:-default}" >> "$GITHUB_OUTPUT"
          printf 'node-arch=%s\n' "$(node -p process.arch)" >> "$GITHUB_OUTPUT"
      - name: Cache Go modules and objects
        uses: actions/cache@v4
        with:
          path: |
            ${{ steps.go-cache.outputs.modules }}
            ${{ steps.go-cache.outputs.objects }}
          key: ttsc-go-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.go-cache.outputs.image }}-${{ steps.go.outputs.go-version }}-${{ github.workflow }}-${{ matrix.name || 'host' }}-${{ hashFiles('**/*.go', '**/go.mod', '**/go.sum', '**/go.work', '**/go.work.sum', 'package.json', 'packages/ttsc/package.json', 'packages/ttsc-*/package.json', 'packages/ttsc/build/**', 'packages/ttsc/driver/resolutioninputs/recorder.cjs', 'packages/ttsc/test/driver/fixtures/rewrite-runtime/**', 'packages/lint/linthost/polyfill_data_gen.json', 'packages/lint/linthost/rule_codes.json', 'pnpm-lock.yaml', '.github/workflows/setup.yml') }}
          restore-keys: |
            ttsc-go-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.go-cache.outputs.image }}-${{ steps.go.outputs.go-version }}-${{ github.workflow }}-${{ matrix.name || 'host' }}-
            ttsc-go-full-build-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.go-cache.outputs.image }}-${{ steps.go.outputs.go-version }}-
            ttsc-go-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.go-cache.outputs.image }}-${{ steps.go.outputs.go-version }}-build-host-
            ttsc-go-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.go-cache.outputs.image }}-${{ steps.go.outputs.go-version }}-website-host-
            ttsc-go-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.go-cache.outputs.image }}-${{ steps.go.outputs.go-version }}-
            setup-go-${{ runner.os }}-${{ steps.go-cache.outputs.node-arch }}-${{ runner.os == 'Linux' && format('{0}-', steps.go-cache.outputs.image) || '' }}go-${{ steps.go.outputs.go-version }}-
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter ttsc --filter ./packages/ttsc-${{ matrix.name }} build
      - run: pnpm --filter @ttsc/test-e2e start --installation
