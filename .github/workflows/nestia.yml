name: nestia

on:
  pull_request:
    paths:
      - ".github/workflows/nestia.yml"
      - "experimental/native-host-provenance/**"
      - "patches/typia@15.0.0.patch"
      - "experimental/tarballs/**"
      - "config/**"
      - "scripts/assert-platform-package.cjs"
      - "scripts/build-current.cjs"
      - "scripts/build-platform-package.cjs"
      - "scripts/go-build-cache.cjs"
      - "scripts/go-sdk-extraction.cjs"
      - "scripts/go-sdk-integrity.cjs"
      - "scripts/go-work.cjs"
      - "scripts/ci/consumer-go-workspace.cjs"
      - "scripts/platform-target.cjs"
      - "packages/ttsc/**"
      - "packages/banner/**"
      - "packages/lint/**"
      - "packages/paths/**"
      - "packages/strip/**"
      - "packages/ttsc-*/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
  workflow_dispatch:

concurrency:
  group: nestia-${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  # Build the current-platform tarballs and run nestia's complete upstream
  # suite in one broad last-defense job. Keeping producer and consumer on the
  # same runner avoids an artifact handoff and duplicated toolchain setup.
  nestia:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Only build + pack the current platform (ttsc-linux-x64) — nestia's
      # overrides pull in ttsc.tgz + ttsc-linux-x64.tgz only. The full
      # cross-platform matrix takes ~20 min for tarballs we never consume.
      TTSC_TARBALLS_CURRENT: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.6.4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.x

      - uses: actions/setup-go@v5
        with:
          go-version-file: packages/ttsc/go.mod
          cache-dependency-path: "**/go.sum"

      - name: Install ttsc dependencies
        run: pnpm install --frozen-lockfile

      - name: Build ttsc tarballs (current platform only)
        run: pnpm package:tgz

      - name: Check out latest nestia master
        uses: actions/checkout@v4
        with:
          repository: samchon/nestia
          ref: master
          path: experimental/nestia

      - name: Add native host output ownership reporting
        run: git -C experimental/nestia apply --directory=packages/core "$GITHUB_WORKSPACE/experimental/native-host-provenance/nestia.patch"

      - name: Use local ttsc tarballs
        working-directory: experimental/nestia
        run: |
          # nestia resolves ttsc through a catalog and may grow its own
          # top-level `overrides:` block, in which case appending a second one
          # makes pnpm fail with a duplicated-mapping-key YAML error (see the
          # typia workflow). Merge the local-tarball overrides into the existing
          # block instead, creating it only when absent, and no-op on re-run.
          node -e '
          const fs = require("fs");
          const path = require("path");
          const file = "pnpm-workspace.yaml";
          const text = fs.readFileSync(file, "utf8");
          const entries = [
            "  ttsc: file:../tarballs/ttsc.tgz",
            "  \"@ttsc/unplugin\": file:../tarballs/unplugin.tgz",
            "  \"@ttsc/linux-x64\": file:../tarballs/ttsc-linux-x64.tgz",
          ].join("\n");
          let merged = text.includes("file:../tarballs/ttsc.tgz")
            ? text
            : /^overrides:[ \t]*$/m.test(text)
              ? text.replace(/^overrides:[ \t]*$/m, (line) => line + "\n" + entries)
              : text.replace(/\s*$/, "") + "\n\noverrides:\n" + entries + "\n";
          // The standalone typia host is also exercised by nestia tests.
          // Install the same physical-write provenance implementation used by
          // this workspace while retaining the version selected by nestia master.
          const patch = path.join(process.env.GITHUB_WORKSPACE, "patches", "typia@15.0.0.patch");
          const patchEntry = "  typia@15.0.0: " + JSON.stringify(patch);
          if (!merged.includes(patchEntry)) {
            if (/^[ \t]+["\u0027]?typia@15\.0\.0["\u0027]?:/m.test(merged))
              throw new Error("typia already has a different consumer patch");
            merged = /^patchedDependencies:[ \t]*$/m.test(merged)
              ? merged.replace(/^patchedDependencies:[ \t]*$/m, (line) => line + "\n" + patchEntry)
              : merged.replace(/\s*$/, "") + "\n\npatchedDependencies:\n" + patchEntry + "\n";
          }
          fs.writeFileSync(file, merged);

          // An auto-installed peer can resolve the registry build with the
          // same version instead of the candidate tarball. Bind each importer
          // that consumes a compiler host directly to the candidate compiler.
          const ttscTarball = path.resolve("../tarballs/ttsc.tgz");
          const sections = ["dependencies", "devDependencies", "optionalDependencies", "peerDependencies"];
          const visit = (directory) => {
            for (const entry of fs.readdirSync(directory, { withFileTypes: true })) {
              if (entry.name === ".git" || entry.name === "node_modules") continue;
              const target = path.join(directory, entry.name);
              if (entry.isDirectory()) visit(target);
              else if (entry.name === "package.json") {
                const manifest = JSON.parse(fs.readFileSync(target, "utf8"));
                const has = (name) => sections.some((section) => manifest[section]?.[name] !== undefined);
                if (!["typia", "@ttsc/factory", "@ttsc/unplugin"].some(has) || has("ttsc")) continue;
                manifest.devDependencies ??= {};
                manifest.devDependencies.ttsc = "file:" + path.relative(path.dirname(target), ttscTarball).replaceAll(path.sep, "/");
                fs.writeFileSync(target, JSON.stringify(manifest, null, 2) + "\n");
              }
            }
          };
          visit(".");
          '

      - name: Install nestia dependencies
        working-directory: experimental/nestia
        run: pnpm install --no-frozen-lockfile

      - name: Use System Go For Source Plugin Build
        run: echo "TTSC_GO_BINARY=$(go env GOROOT)/bin/go" >> "$GITHUB_ENV"

      - name: Bind nestia Go tests to the current driver and shims
        run: |
          node scripts/ci/consumer-go-workspace.cjs "$RUNNER_TEMP/nestia-current-driver.work" \
            experimental/nestia/packages/core/native \
            experimental/nestia/packages/core/test \
            experimental/nestia/packages/sdk/native \
            experimental/nestia/packages/sdk/test

      - name: Test nestia
        working-directory: experimental/nestia
        env:
          # Mirror nestia's own test.yml: keep Node's native TS strip / module
          # detection off so the e2e run matches nestia's CI environment.
          NODE_OPTIONS: --no-experimental-strip-types --no-experimental-detect-module
          TTSC_CACHE_DIR: ${{ runner.temp }}/nestia-plugin-cache
        run: |
          pnpm build
          GOWORK="$RUNNER_TEMP/nestia-current-driver.work" pnpm test:go
          pnpm --filter=./tests/test-* --workspace-concurrency=1 --no-bail -r start
