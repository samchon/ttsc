name: nestia

on: pull_request

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nestia:
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --no-experimental-strip-types --no-experimental-detect-module
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.6.4
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
      - uses: actions/setup-go@v7
        with:
          go-version-file: packages/ttsc/go.mod
          cache-dependency-path: "**/go.sum"
      - run: pnpm install --frozen-lockfile
      - run: pnpm run package:tgz
      - uses: actions/checkout@v7
        with:
          repository: samchon/nestia
          path: experimental/nestia
      - run: git -C experimental/nestia apply --directory=packages/core "$GITHUB_WORKSPACE/experimental/native-host-provenance/nestia.patch"
      - run: git -C experimental/nestia apply "$GITHUB_WORKSPACE/experimental/native-host-provenance/nestia-typia-pin.patch"
      - run: git -C experimental/nestia apply "$GITHUB_WORKSPACE/experimental/native-host-provenance/nestia-declared-catalogs.patch"
      - run: git -C experimental/nestia apply "$GITHUB_WORKSPACE/experimental/native-host-provenance/nestia-owned-temporary-directories.patch"
      - run: >-
          node .github/workflows/scripts/consumer.cjs experimental/nestia
          --go=experimental/nestia/packages/core/native --go=experimental/nestia/packages/core/test
          --go=experimental/nestia/packages/sdk/native --go=experimental/nestia/packages/sdk/test
      - run: pnpm install --no-frozen-lockfile
        working-directory: experimental/nestia
      - run: pnpm build
        working-directory: experimental/nestia
      - run: pnpm --filter @nestia/core --filter @nestia/sdk --no-bail -r run test:go
        working-directory: experimental/nestia
      - run: go test -count=1 ./...
        working-directory: experimental/nestia/packages/core/native
      - run: pnpm --filter "./tests/test-*" --workspace-concurrency=1 --no-bail -r start
        working-directory: experimental/nestia
