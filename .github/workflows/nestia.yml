name: nestia

on: pull_request

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nestia:
    runs-on: ubuntu-latest
    env:
      TTSC_GO_BINARY: go
      TTSC_CACHE_DIR: ${{ github.workspace }}/node_modules/.cache/ttsc
      GOCACHE: ${{ github.workspace }}/node_modules/.cache/ttsc/go-build
      GOMODCACHE: ${{ github.workspace }}/node_modules/.cache/ttsc/go-mod
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.6.4
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
      - uses: actions/setup-go@v7
        id: go
        with:
          go-version-file: packages/ttsc/go.mod
          cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter ttsc --filter @ttsc/unplugin --filter ./packages/ttsc-linux-x64 -r --workspace-concurrency=1 build
      - run: pnpm --filter ttsc --filter @ttsc/unplugin --filter ./packages/ttsc-linux-x64 exec pnpm pack --out "../../experimental/tarballs/%s.tgz"
      - uses: actions/checkout@v7
        with:
          repository: samchon/nestia
          path: experimental/nestia
      - run: node .github/workflows/scripts/nestia-source-admission.cjs bind experimental/nestia
      - run: >-
          node .github/workflows/scripts/consumer.cjs experimental/nestia
          --patch=.github/workflows/patches/nestia-master-emit-provenance.patch
          --package-patch=typia@15.0.0=.github/workflows/patches/typia-15.0.0-emit-provenance.patch
          --go=experimental/nestia/packages/core/native --go=experimental/nestia/packages/core/test
          --go=experimental/nestia/packages/sdk/native --go=experimental/nestia/packages/sdk/test
      - run: pnpm install --no-frozen-lockfile
        working-directory: experimental/nestia
      - name: Cache Compiler Artifacts
        uses: actions/cache@v4
        with:
          path: node_modules/.cache/ttsc
          key: ttsc-${{ runner.os }}-${{ steps.go.outputs.go-version }}-nestia-${{ hashFiles('pnpm-lock.yaml', 'packages/ttsc/go.*', 'packages/ttsc/src/**', 'packages/ttsc/cmd/**', 'packages/ttsc/driver/**', 'packages/ttsc/internal/**', 'packages/ttsc/shim/**', 'packages/ttsc/utility/**', '.github/workflows/patches/**', 'experimental/nestia/pnpm-lock.yaml', 'experimental/nestia/packages/core/native/**', 'experimental/nestia/packages/sdk/native/**', 'experimental/nestia/packages/*/test/go.*') }}
          restore-keys: |
            ttsc-${{ runner.os }}-${{ steps.go.outputs.go-version }}-nestia-
      - run: node .github/workflows/scripts/nestia-source-admission.cjs admit experimental/nestia
      - run: pnpm build
        working-directory: experimental/nestia
        env:
          NODE_OPTIONS: --no-experimental-strip-types --no-experimental-detect-module
      - run: pnpm evidence
        working-directory: experimental/nestia
        env:
          NODE_OPTIONS: --no-experimental-strip-types --no-experimental-detect-module
      - run: pnpm test:go
        working-directory: experimental/nestia
        env:
          GOWORK: ${{ github.workspace }}/experimental/nestia/go.work
          NODE_OPTIONS: --no-experimental-strip-types --no-experimental-detect-module
      - run: pnpm test:unit
        working-directory: experimental/nestia
        env:
          NODE_OPTIONS: --no-experimental-strip-types --no-experimental-detect-module
      - run: pnpm test:e2e
        working-directory: experimental/nestia
        env:
          NODE_OPTIONS: --no-experimental-strip-types --no-experimental-detect-module
