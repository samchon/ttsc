name: build

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/build.yml"
      - ".github/actions/validation-cache/**"
      - "config/**"
      - "scripts/assert-platform-package.cjs"
      - "scripts/assert-ttscgraph-release-candidate.cjs"
      - "scripts/build-platform-package.cjs"
      - "scripts/build-platforms.cjs"
      - "scripts/ci/run-independent.cjs"
      - "scripts/go-build-cache.cjs"
      - "scripts/go-sdk-extraction.cjs"
      - "scripts/go-sdk-integrity.cjs"
      - "scripts/go-wasm-exec.cjs"
      - "scripts/platform-target.cjs"
      - "packages/**"
      - "!packages/unplugin/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
  pull_request:
    paths:
      - ".github/workflows/build.yml"
      - ".github/actions/validation-cache/**"
      - "config/**"
      - "scripts/assert-platform-package.cjs"
      - "scripts/assert-ttscgraph-release-candidate.cjs"
      - "scripts/build-platform-package.cjs"
      - "scripts/build-platforms.cjs"
      - "scripts/ci/run-independent.cjs"
      - "scripts/go-build-cache.cjs"
      - "scripts/go-sdk-extraction.cjs"
      - "scripts/go-sdk-integrity.cjs"
      - "scripts/go-wasm-exec.cjs"
      - "scripts/platform-target.cjs"
      - "packages/**"
      - "!packages/unplugin/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"

concurrency:
  group: build-${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}
  cancel-in-progress: false

env:
  GOCACHE: ${{ github.workspace }}/.cache/ci/go-build

jobs:
  Ubuntu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24.x

      - uses: actions/setup-go@v7
        with:
          go-version-file: packages/ttsc/go.mod
          cache: false

      - uses: pnpm/action-setup@v6
        with:
          version: 10.6.4

      - uses: ./.github/actions/validation-cache
        with:
          group: build
          go-group: build
          save-go: "true"
          cross-sdk: "true"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Packages
        run: pnpm run build
        env:
          TTSC_PLATFORM_BUILD_WORKERS: 2

      - name: Smoke release-candidate ttscgraph snapshot
        run: node scripts/assert-ttscgraph-release-candidate.cjs

      - name: Assert dist artifacts exist
        run: |
          test -f packages/wasm/dist/ttsc.wasm
          test -f packages/wasm/dist/wasm_exec.js
          test -f packages/wasm/dist/go.mod
          test -d packages/wasm/shim-vendor/shim

      - name: Tarball smoke (pack + inspect)
        run: |
          cd packages/wasm
          pnpm pack --pack-destination /tmp
          tar -tzf /tmp/ttsc-wasm-*.tgz | grep -q shim-vendor/shim/ast/shim.go
          tar -tzf /tmp/ttsc-wasm-*.tgz | grep -q dist/ttsc.wasm
