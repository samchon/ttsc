name: build

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/build.yml"
      - "config/**"
      - "scripts/assert-platform-package.cjs"
      - "scripts/assert-ttscgraph-release-candidate.cjs"
      - "scripts/build-platform-package.cjs"
      - "scripts/build-platforms.cjs"
      - "scripts/ci/run-independent.cjs"
      - "scripts/go-build-cache.cjs"
      - "scripts/go-sdk-extraction.cjs"
      - "scripts/go-sdk-integrity.cjs"
      - "scripts/go-wasm-exec.cjs"
      - "scripts/platform-target.cjs"
      - "packages/**"
      - "!packages/unplugin/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
  pull_request:
    paths:
      - ".github/workflows/build.yml"
      - "config/**"
      - "scripts/assert-platform-package.cjs"
      - "scripts/assert-ttscgraph-release-candidate.cjs"
      - "scripts/build-platform-package.cjs"
      - "scripts/build-platforms.cjs"
      - "scripts/ci/run-independent.cjs"
      - "scripts/go-build-cache.cjs"
      - "scripts/go-sdk-extraction.cjs"
      - "scripts/go-sdk-integrity.cjs"
      - "scripts/go-wasm-exec.cjs"
      - "scripts/platform-target.cjs"
      - "packages/**"
      - "!packages/unplugin/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"

concurrency:
  group: build-${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}
  cancel-in-progress: false

jobs:
  Ubuntu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10.6.4
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: pnpm

      - uses: actions/setup-go@v7
        with:
          go-version-file: packages/ttsc/go.mod
          cache-dependency-path: "**/go.sum"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Packages
        run: pnpm run build
        env:
          TTSC_PLATFORM_BUILD_WORKERS: 2
          TTSC_PACKAGE_BUILD_WORKERS: 2
          TTSC_PLATFORM_BUILD_SET: ci-remainder

      - name: Smoke release-candidate ttscgraph snapshot
        run: node scripts/assert-ttscgraph-release-candidate.cjs
