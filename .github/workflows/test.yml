name: test

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

concurrency:
  group: unit-${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.6.4
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: pnpm
      - uses: actions/setup-go@v7
        with:
          go-version-file: packages/ttsc/go.mod
          cache-dependency-path: "**/go.sum"
      - name: Install unit test dependencies
        run: pnpm --filter @ttsc/station --filter @ttsc/test-lint... --filter @ttsc/unplugin --filter @ttsc/test-factory... --filter @ttsc/test-playground... --filter @ttsc/test-wasm... --filter @ttsc/test-graph... --filter @ttsc/benchmark-evidence --filter test-evidence-benchmark --filter test-evidence... --filter @ttsc/test-metro... install --frozen-lockfile --ignore-scripts
      - name: Run unit tests
        run: node scripts/ci/run-unit-tests.cjs
