name: test

# Keep the stable planner/aggregate check present on every pull request.
# Workflow-level path filters can strand a required check in Pending and GitHub
# evaluates only the first 300 changed files. The planner below skips expensive
# jobs after inspecting the complete local Git diff.
on:
  push:
    branches:
      - master
  pull_request:

concurrency:
  group: test-${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      watch: ${{ steps.plan.outputs.watch }}
      lanes: ${{ steps.plan.outputs.lanes }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Select affected validation
        id: plan
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: >-
          node scripts/ci/validation-plan.cjs
          --base "$BASE_SHA"
          --head "$HEAD_SHA"
          --event "$EVENT_NAME"
          --github-output "$GITHUB_OUTPUT"

  watch-platforms:
    name: watch (${{ matrix.os }})
    needs: plan
    if: needs.plan.outputs.watch == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24.x

      - uses: actions/setup-go@v7
        with:
          go-version-file: packages/ttsc/go.mod
          cache-dependency-path: |
            packages/ttsc/go.sum
            packages/ttsc/tools/shim_audit/go.sum
            tests/go-transformer/go.mod

      - uses: pnpm/action-setup@v6
        with:
          version: 10.6.4

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Use System Go For Source Plugin Tests
        shell: bash
        run: echo "TTSC_GO_BINARY=$(go env GOROOT)/bin/go" >> "$GITHUB_ENV"

      - name: Build Current Platform
        run: pnpm run build:current
        env:
          TTSC_BUILD_SCOPE: test-ttsc

      - name: Run watch tests
        run: pnpm --filter @ttsc/test-ttsc start
        env:
          TTSC_TEST_DIR: features/watch

  test:
    name: ${{ matrix.name }}
    needs: plan
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      - uses: actions/setup-go@v7
        if: matrix.needsGo
        with:
          go-version-file: packages/ttsc/go.mod
          cache-dependency-path: |
            packages/ttsc/go.sum
            packages/ttsc/tools/shim_audit/go.sum
            tests/go-transformer/go.mod

      - uses: pnpm/action-setup@v6
        with:
          version: 10.6.4

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Use System Go For Source Plugin Tests
        if: matrix.needsGo
        shell: bash
        run: echo "TTSC_GO_BINARY=$(go env GOROOT)/bin/go" >> "$GITHUB_ENV"

      - name: Build ${{ matrix.name }}
        if: matrix.build != ''
        run: ${{ matrix.build }}
        env:
          TTSC_BUILD_SCOPE: ${{ matrix.scope }}

      - name: Run ${{ matrix.name }}
        run: ${{ matrix.run }}
        env:
          TTSC_TEST_DIRS: ${{ matrix.dirs }}

  ci:
    name: ci
    needs:
      - plan
      - watch-platforms
      - test
    # A superseding PR push cancels this run. Do not leave this always-job
    # queued behind the cancellation and block the next run's concurrency slot.
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require every selected validation
        shell: bash
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          TEST_RESULT: ${{ needs.test.result }}
          WATCH_RESULT: ${{ needs.watch-platforms.result }}
          WATCH_SELECTED: ${{ needs.plan.outputs.watch }}
          SELECTED_LANES: ${{ needs.plan.outputs.lanes }}
        run: |
          echo "selected lanes: $SELECTED_LANES"
          echo "plan=$PLAN_RESULT test=$TEST_RESULT watch=$WATCH_RESULT selected=$WATCH_SELECTED"
          test "$PLAN_RESULT" = "success"
          test "$TEST_RESULT" = "success"
          if [ "$WATCH_SELECTED" = "true" ]; then
            test "$WATCH_RESULT" = "success"
          else
            test "$WATCH_RESULT" = "skipped"
          fi
