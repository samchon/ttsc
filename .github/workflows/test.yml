name: test

# Keep the stable planner/aggregate check present on every pull request.
# Workflow-level path filters can strand a required check in Pending and GitHub
# evaluates only the first 300 changed files. The planner below skips expensive
# jobs after inspecting the complete local Git diff.
on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

concurrency:
  group: test-${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      lanes: ${{ steps.plan.outputs.lanes }}
      platform_matrix: ${{ steps.plan.outputs.platform_matrix }}
      platform: ${{ steps.plan.outputs.platform }}
      platform_tasks: ${{ steps.plan.outputs.platform_tasks }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Select affected validation
        id: plan
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: >-
          node scripts/ci/validation-plan.cjs
          --base "$BASE_SHA"
          --head "$HEAD_SHA"
          --event "$EVENT_NAME"
          --github-output "$GITHUB_OUTPUT"

  platform-integrations:
    name: platform (${{ matrix.name }})
    needs: plan
    if: needs.plan.outputs.platform == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.platform_matrix) }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24.x

      - uses: actions/setup-go@v7
        if: matrix.experimental || matrix.watch
        with:
          go-version-file: packages/ttsc/go.mod
          cache-dependency-path: |
            packages/ttsc/go.sum
            packages/ttsc/tools/shim_audit/go.sum
            tests/go-transformer/go.mod

      - uses: pnpm/action-setup@v6
        with:
          version: 10.6.4

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Installed Tarballs With Bundled Go
        if: matrix.experimental
        run: pnpm run experimental

      - name: Use System Go For Source Plugin Tests
        if: matrix.watch
        shell: bash
        run: echo "TTSC_GO_BINARY=$(go env GOROOT)/bin/go" >> "$GITHUB_ENV"

      - name: Build Current Platform For Watch
        if: matrix.watch && !matrix.experimental
        run: pnpm run build:current
        env:
          TTSC_BUILD_SCOPE: experimental

      - name: Run watch tests
        if: matrix.watch
        run: pnpm --filter @ttsc/test-ttsc start
        env:
          TTSC_TEST_DIR: features/watch

      - name: Ensure VS Code CLI (Ubuntu)
        if: matrix.vscode && runner.os == 'Linux'
        shell: bash
        run: |
          if ! command -v code >/dev/null 2>&1; then
            curl -fsSL -o "$RUNNER_TEMP/vscode.deb" "https://update.code.visualstudio.com/latest/linux-deb-x64/stable"
            sudo apt-get update
            sudo apt-get install -y "$RUNNER_TEMP/vscode.deb"
          fi
          code --version

      - name: Ensure VS Code CLI (macOS)
        if: matrix.vscode && runner.os == 'macOS'
        shell: bash
        run: |
          code_bin="/Applications/Visual Studio Code.app/Contents/Resources/app/bin"
          if ! command -v code >/dev/null 2>&1; then
            brew install --cask visual-studio-code
          fi
          if [ -d "$code_bin" ]; then
            echo "$code_bin" >> "$GITHUB_PATH"
            export PATH="$code_bin:$PATH"
          fi
          code --version

      - name: Ensure VS Code CLI (Windows)
        if: matrix.vscode && runner.os == 'Windows'
        shell: pwsh
        run: |
          function Add-CodePaths {
            $dirs = @(
              "$env:LOCALAPPDATA\Programs\Microsoft VS Code\bin",
              "$env:ProgramFiles\Microsoft VS Code\bin",
              "${env:ProgramFiles(x86)}\Microsoft VS Code\bin"
            )
            foreach ($dir in $dirs) {
              if ($dir -and (Test-Path $dir)) {
                Add-Content -Path $env:GITHUB_PATH -Value $dir
                $env:Path = "$dir;$env:Path"
              }
            }
          }
          Add-CodePaths
          if (-not (Get-Command code.cmd -ErrorAction SilentlyContinue)) {
            choco install vscode -y --no-progress
            Add-CodePaths
          }
          code --version

      - name: Build @ttsc/vscode
        if: matrix.vscode
        run: pnpm --filter @ttsc/vscode build

      - name: Smoke-install @ttsc/vscode in VS Code
        if: matrix.vscode
        run: node scripts/smoke-vscode-install.cjs packages/vscode

  test:
    name: ${{ matrix.name }}
    needs: plan
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      - uses: actions/setup-go@v7
        if: matrix.needsGo
        with:
          go-version-file: packages/ttsc/go.mod
          cache-dependency-path: |
            packages/ttsc/go.sum
            packages/ttsc/tools/shim_audit/go.sum
            tests/go-transformer/go.mod

      - uses: pnpm/action-setup@v6
        with:
          version: 10.6.4

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Use System Go For Source Plugin Tests
        if: matrix.needsGo
        shell: bash
        run: echo "TTSC_GO_BINARY=$(go env GOROOT)/bin/go" >> "$GITHUB_ENV"

      - name: Build ${{ matrix.name }}
        if: matrix.build != ''
        run: ${{ matrix.build }}
        env:
          TTSC_BUILD_SCOPE: ${{ matrix.scope }}

      - name: Run ${{ matrix.name }}
        run: ${{ matrix.run }}
        env:
          TTSC_TEST_DIRS: ${{ matrix.dirs }}

  ci:
    name: ci
    needs:
      - plan
      - platform-integrations
      - test
    # A superseding PR push cancels this run. Do not leave this always-job
    # queued behind the cancellation and block the next run's concurrency slot.
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require every selected validation
        shell: bash
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          TEST_RESULT: ${{ needs.test.result }}
          PLATFORM_RESULT: ${{ needs.platform-integrations.result }}
          PLATFORM_SELECTED: ${{ needs.plan.outputs.platform }}
          PLATFORM_TASKS: ${{ needs.plan.outputs.platform_tasks }}
          SELECTED_LANES: ${{ needs.plan.outputs.lanes }}
        run: |
          echo "selected lanes: $SELECTED_LANES"
          echo "selected platform tasks: $PLATFORM_TASKS"
          echo "plan=$PLAN_RESULT test=$TEST_RESULT platform=$PLATFORM_RESULT selected=$PLATFORM_SELECTED"
          test "$PLAN_RESULT" = "success"
          test "$TEST_RESULT" = "success"
          if [ "$PLATFORM_SELECTED" = "true" ]; then
            test "$PLATFORM_RESULT" = "success"
          else
            test "$PLATFORM_RESULT" = "skipped"
          fi
