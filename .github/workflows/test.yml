name: test

on: pull_request

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: win32-x64, runner: windows-2025 }
          - { platform: linux-x64, runner: ubuntu-latest }
          - { platform: darwin-arm64, runner: macos-15 }
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.6.4
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: pnpm
      - uses: actions/setup-go@v7
        id: go
        with:
          go-version-file: packages/ttsc/go.mod
          cache: false
      - name: Locate Go caches
        id: go-cache
        shell: bash
        run: |
          printf 'modules=%s\n' "$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
          printf 'objects=%s\n' "$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
          printf 'GOCACHE=%s\n' "$(go env GOCACHE)" >> "$GITHUB_ENV"
          printf 'image=%s\n' "${ImageOS:-default}" >> "$GITHUB_OUTPUT"
          printf 'node-arch=%s\n' "$(node -p process.arch)" >> "$GITHUB_OUTPUT"
          printf 'epoch=%s\n' "$(node -p 'Math.floor(Date.now() / 604800000)')" >> "$GITHUB_OUTPUT"
      - name: Restore Go modules and objects
        id: go-objects
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ steps.go-cache.outputs.modules }}
            ${{ steps.go-cache.outputs.objects }}
          # Go validates each object's source, compiler and flags; share only object/module caches.
          # A weekly snapshot admits new objects without creating a copy for every source edit/workflow.
          key: ttsc-go-shared-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.go-cache.outputs.image }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('packages/**/go.mod', 'packages/**/go.sum', 'go.work') }}-${{ steps.go-cache.outputs.epoch }}
          restore-keys: |
            ttsc-go-shared-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.go-cache.outputs.image }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('packages/**/go.mod', 'packages/**/go.sum', 'go.work') }}-
            ttsc-go-shared-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.go-cache.outputs.image }}-${{ steps.go.outputs.go-version }}-
            ttsc-go-full-build-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.go-cache.outputs.image }}-${{ steps.go.outputs.go-version }}-
            ttsc-go-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.go-cache.outputs.image }}-${{ steps.go.outputs.go-version }}-
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ttsc/lint run build
      - run: pnpm --filter @ttsc/evidence run build
      - name: Prepare generated Graph implementation once
        id: native-build
        shell: bash
        run: |
          pnpm --filter ttsc run build
          pnpm --filter @ttsc/${{ matrix.platform }} run build
          pnpm --filter @ttsc/graph run build
      - run: pnpm run test:go
        id: go-tests
      - run: pnpm run test:units
        if: ${{ !cancelled() && steps.native-build.outcome == 'success' }}
      - name: Save Completed Native Go Caches
        if: ${{ !cancelled() && steps.native-build.outcome == 'success' && steps.go-tests.outcome == 'success' && steps.go-objects.outputs.cache-primary-key != '' && steps.go-objects.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ steps.go-cache.outputs.modules }}
            ${{ steps.go-cache.outputs.objects }}
          key: ${{ steps.go-objects.outputs.cache-primary-key }}
