name: test

# Portable validation shares one Linux job. Other operating systems only
# install the package and execute the CLI. No planner or aggregate jobs.
on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

concurrency:
  group: test-${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Cache Go's intermediate objects separately from each deliberately cold plugin
# root. Native executables are always built from the current checkout.
env:
  GOCACHE: ${{ github.workspace }}/.cache/ci/go-build
  TTSC_TEST_CACHE_DIR: ${{ github.workspace }}/.cache/ci/plugins

jobs:
  validation:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
      - uses: actions/setup-go@v7
        with:
          go-version-file: packages/ttsc/go.mod
          cache: false
      - uses: pnpm/action-setup@v6
        with:
          version: 10.6.4
      - uses: ./.github/actions/validation-cache
        with:
          group: linux-validation
          save-go: "true"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Ensure Yarn for workspace layout contracts
        run: npm install --global yarn@1.22.22
      - name: Install dependencies once
        run: pnpm install --frozen-lockfile
      - name: Use system Go for tests
        shell: bash
        run: echo "TTSC_GO_BINARY=$(go env GOROOT)/bin/go" >> "$GITHUB_ENV"
      - name: Build shared validation dependencies once
        id: build
        run: pnpm run build:current
        env:
          TTSC_BUILD_SCOPE: full
      - name: Unit and integration validation
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node scripts/ci/run-validation-group.cjs --lanes=all --concurrency=2
        env:
          TTSC_TEST_WORKERS: 2
          TTSC_GO_TEST_WORKERS: 2
          TTSC_BUN_BINARY: bun
      - name: Packed adapter contracts
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: pnpm --dir experimental/test-unplugin start -- --pack-current
        env:
          TTSC_HOST_WORKERS: 3
          TTSC_UNPLUGIN_SKIP_BUILD: "1"
      - name: Installed CLI smoke
        id: installed
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: pnpm exec node scripts/ci/installed-cli-smoke.cjs --keep
      - name: Verify VS Code installation once
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        shell: bash
        run: |
          if ! command -v code >/dev/null 2>&1; then
            curl -fsSL -o "$RUNNER_TEMP/vscode.deb" "https://update.code.visualstudio.com/latest/linux-deb-x64/stable"
            sudo apt-get install -y "$RUNNER_TEMP/vscode.deb"
          fi
          node scripts/smoke-vscode-install.cjs packages/vscode
      - name: Read supported Node minimum
        id: nodes
        shell: bash
        run: node -e "console.log('minimum='+require('./scripts/ci/validation-suites.cjs').NODE_FLOOR)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v7
        if: ${{ !cancelled() && steps.installed.outcome == 'success' }}
        with:
          node-version: ${{ steps.nodes.outputs.minimum }}
      - name: Minimum Node installed CLI smoke
        if: ${{ !cancelled() && steps.installed.outcome == 'success' }}
        run: pnpm exec node scripts/ci/installed-cli-smoke.cjs --reuse
      - uses: actions/setup-node@v7
        if: ${{ !cancelled() && steps.installed.outcome == 'success' }}
        with:
          node-version: current
      - name: Current Node installed CLI smoke
        if: ${{ !cancelled() && steps.installed.outcome == 'success' }}
        run: pnpm exec node scripts/ci/installed-cli-smoke.cjs --reuse

  installed-smoke:
    name: install (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            runner: windows-2025
          - name: macOS
            runner: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
      - uses: actions/setup-go@v7
        with:
          go-version-file: packages/ttsc/go.mod
          cache: false
      - uses: pnpm/action-setup@v6
        with:
          version: 10.6.4
      - uses: ./.github/actions/validation-cache
        with:
          group: install-smoke
          save-go: "true"
      - name: Install build dependencies
        run: pnpm install --frozen-lockfile
      - name: Build the current platform CLI
        run: pnpm run build:current
        env:
          TTSC_BUILD_SCOPE: install-smoke
      - name: Install and execute the packed CLI
        run: pnpm exec node scripts/ci/installed-cli-smoke.cjs
