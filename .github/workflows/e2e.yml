name: e2e

on: pull_request

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.6.4
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: pnpm
      - uses: actions/setup-go@v7
        with:
          go-version-file: packages/ttsc/go.mod
          cache-dependency-path: "**/go.sum"
      - run: pnpm install --frozen-lockfile
      - uses: oven-sh/setup-bun@v2
      - run: npm install --global yarn
      - run: pnpm run build
        id: build
      - run: pnpm run test:e2e
      - name: Prepare compiler subset measurement inputs
        id: compiler-input
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          TTSC_E2E_TRACE: ${{ runner.temp }}/e2e-compiler-comparison
          TTSC_TEST_CACHE_DIR: ${{ runner.temp }}/e2e-compiler-cache
          E2E_MEASUREMENT_FAMILY: compiler
        run: &prepare-measurement-input |
          if [ "$E2E_MEASUREMENT_FAMILY" = unplugin ]; then
            TTSC_BUN_BINARY="$(command -v "${TTSC_BUN_BINARY:-bun}")"
            export TTSC_BUN_BINARY
          fi
          node <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const path = require('node:path');
          const root = process.cwd();
          const traceRoot = process.env.TTSC_E2E_TRACE;
          const cacheRoot = process.env.TTSC_TEST_CACHE_DIR;
          const family = process.env.E2E_MEASUREMENT_FAMILY;
          assert.ok(['compiler', 'compiler-stub', 'runtime', 'native-consumer', 'unplugin', 'graph', 'metro', 'installation'].includes(family));
          if (family === 'installation') {
            assert.equal(process.platform, 'linux');
            assert.equal(process.arch, 'x64');
          }
          assert.ok(path.isAbsolute(traceRoot) && path.isAbsolute(cacheRoot));
          fs.mkdirSync(traceRoot);
          fs.mkdirSync(cacheRoot);
          const { resolveBinary } = require('./packages/ttsc/lib/internal/nativeBinary.js');
          const { resolveTsgo } = require('./packages/ttsc/lib/compiler/internal/resolveTsgo.js');
          const native = resolveBinary();
          assert.ok(native && path.isAbsolute(native));
          const tsgo = resolveTsgo({ cwd: path.join(root, 'packages/ttsc') }).binary;
          assert.equal(fs.realpathSync.native(tsgo),
            fs.realpathSync.native(resolveTsgo({ cwd: root }).binary));
          const assets = [
            { label: 'prepared-node', role: 'executable', file: process.execPath },
            { label: 'prepared-native-host', role: 'executable', file: native },
            { label: 'prepared-native-typescript', role: 'executable', file: tsgo },
          ];
          if (family === 'unplugin') {
            const bun = process.env.TTSC_BUN_BINARY;
            assert.ok(bun && path.isAbsolute(bun));
            assert.ok(fs.statSync(bun).isFile());
            fs.accessSync(bun, fs.constants.X_OK);
            assets.push({ label: 'prepared-bun', role: 'executable', file: bun });
            fs.appendFileSync(process.env.GITHUB_ENV, 'TTSC_BUN_BINARY=' + bun + '\n');
          }
          if (family === 'graph') {
            const { resolveGraphBinary } = require('./packages/graph/lib/resolveGraphBinary.js');
            const graph = resolveGraphBinary(process.env, path.join(root, 'tests/test-e2e'));
            assert.ok(graph && path.isAbsolute(graph));
            const workspaceGraph = path.join(root, 'packages',
              `ttsc-${process.platform}-${process.arch}`, 'bin',
              process.platform === 'win32' ? 'ttscgraph.exe' : 'ttscgraph');
            assert.equal(fs.realpathSync.native(graph), fs.realpathSync.native(workspaceGraph));
            assets.push({ label: 'prepared-native-graph', role: 'executable', file: graph });
          }
          const files = [
            'pnpm-lock.yaml', 'pnpm-workspace.yaml',
            'config/register-typescript-loader.mjs', 'config/typescript-loader.mjs',
            'tests/utils/src/internal/E2eProcessTraceRuntime.cjs',
            'tests/utils/src/E2eProcessTrace.ts', 'tests/utils/src/TestExecutor.ts',
            'tests/utils/src/TestProject.ts',
            'tests/test-e2e/src/measureLegacyE2e.ts',
            'tests/test-e2e/src/internal/compareE2ePhaseObservations.ts',
            'tests/test-e2e/src/legacyE2eTraceEntry.ts',
            'tests/test-e2e/src/index.ts', 'tests/test-e2e/src/consolidatedE2eIndex.ts',
            ...(family === 'native-consumer' ? [
              'tests/test-e2e/src/features/test_e2e_native.ts',
              'tests/test-e2e/src/features/test_e2e_consumer.ts',
            ] : ['tests/test-e2e/src/features/test_e2e_' + family.replace('-', '_') + '.ts']),
            ...(family === 'compiler' ? [
              'tests/test-e2e/src/features/ttsc/api/test_ttsccompiler_plugin_free_compile_and_transform_share_one_project.ts',
              'tests/test-e2e/src/features/ttsc/compiler/test_compiler_shared_program_preserves_emit_and_diagnostic_boundaries.ts',
              'tests/test-e2e/src/features/ttsc/api/test_compilerusescasesensitivefilenames_answers_what_the_compiler_reports.ts',
              'tests/test-e2e/src/features/ttsc/api/test_factory_jsx_strings_roundtrip_through_native_compile.ts',
            ] : process.env.TTSC_TEST_DIRS.split(',').map(file => 'tests/test-e2e/src/' + file)),
            'packages/ttsc/driver/program.go', 'packages/ttsc/internal/e2etrace/e2etrace.go',
            ...JSON.parse(process.env.E2E_COHORT_ASSET_FILES ?? '[]'),
          ];
          function selectTree(relative) {
            for (const entry of fs.readdirSync(path.join(root, relative), { withFileTypes: true })) {
              const child = relative + '/' + entry.name;
              if (entry.isDirectory()) selectTree(child);
              else if (entry.isFile()) files.push(child);
              else throw new Error('Non-regular selected producer input: ' + child);
            }
          }
          for (const directory of [
            'packages/ttsc/lib',
            'tests/test-e2e/src/internal/ttsc/internal',
            ...(family === 'compiler' ? [
              'packages/factory/src',
              'tests/test-e2e/fixtures/ttsc/api',
              'tests/test-e2e/fixtures/ttsc/compiler/corpus',
              'tests/test-e2e/fixtures/ttsc/compiler/watch',
              'tests/test-e2e/fixtures/ttsc/compiler/subprojects',
              'tests/test-e2e/fixtures/ttsc/compiler/negative',
            ] : family === 'runtime' ? [
              'tests/test-e2e/fixtures/ttsc/runtime-commonjs-corpus',
              ...JSON.parse(process.env.E2E_RUNTIME_FIXTURE_ROOTS).map(directory =>
                'tests/test-e2e/fixtures/' + directory),
            ] : family === 'native-consumer' ? [
              'tests/test-e2e/fixtures/ttsc/api',
              'tests/test-e2e/fixtures/evidence',
              'tests/test-e2e/fixtures/lint',
              'tests/test-e2e/fixtures/utilities',
            ] : family === 'compiler-stub' ? [
              'tests/test-e2e/fixtures/ttsc/compiler/consumer-fake',
              'tests/test-e2e/fixtures/ttsc/compiler/consumer-provenance',
            ] : family === 'installation' ? [] : family === 'metro' ? [
              'tests/test-e2e/fixtures/metro', 'tests/test-e2e/fixtures/unplugin',
            ] : family === 'unplugin' ? ['tests/test-e2e/fixtures/unplugin'] :
              ['tests/test-e2e/fixtures/graph']),
            ...JSON.parse(process.env.E2E_COHORT_ASSET_TREES ?? '[]'),
          ]) selectTree(directory);
          if (family === 'runtime') {
            const { createRequire } = require('node:module');
            const requireFromOwner = createRequire(path.join(root, 'tests/test-e2e/package.json'));
            const tslibRoot = fs.realpathSync.native(path.dirname(requireFromOwner.resolve('tslib/package.json')));
            selectTree(path.relative(root, tslibRoot).split(path.sep).join('/'));
          }
          for (const file of [...new Set(files)].sort())
            assets.push({ label: file, role: file.includes('/fixtures/') ? 'fixture' :
              file.endsWith('.yaml') ? 'configuration' : 'loaded-module', file: path.join(root, file) });
          const input = {
            assets, cacheRoots: [cacheRoot],
            producerLabels: Object.fromEntries(assets.map(asset => [asset.label, asset.label])),
            boundaries: [
              { boundary: 'selected-runner', writerPid: 'runner', event: 'runner-admission',
                data: { runner: 'legacy-index' },
                producerAssets: ['prepared-node', 'tests/utils/src/internal/E2eProcessTraceRuntime.cjs'] },
              ...(family === 'compiler' ? [{ boundary: 'native-driver-create', writerPid: 'observed', event: 'program-construction',
                data: { origin: 'driver-create', outcome: 'constructor-returned' },
                producerAssets: ['prepared-native-host', 'packages/ttsc/driver/program.go',
                  'packages/ttsc/internal/e2etrace/e2etrace.go'] }] : ['graph', 'metro', 'installation'].includes(family) ? [] : [{
                boundary: 'runtime-native-wrapper', writerPid: 'observed', event: 'process-attempt',
                data: { origin: 'spawnSyncResilient' },
                producerAssets: [...(family === 'compiler-stub' ? [
                    'tests/test-e2e/src/internal/ttsc/internal/toolchain.ts',
                    'tests/test-e2e/fixtures/ttsc/compiler/consumer-provenance/recorder.cjs',
                  ] : ['prepared-native-typescript']), 'packages/ttsc/lib/internal/E2ETrace.js',
                  'packages/ttsc/lib/internal/spawnSyncResilient.js',
                  ...(family === 'runtime' ? ['packages/ttsc/lib/launcher/internal/runtime/installRuntimeHooks.js'] :
                    ['packages/ttsc/lib/compiler/internal/spawnNative.js'])],
              }]),
            ],
            commandFiles: [
              { boundary: 'actual-node-command', event: 'selected-file-observation',
                producerAsset: 'prepared-node', minimumCalls: 1 },
            ],
          };
          fs.writeFileSync(path.join(traceRoot, 'measurement-input.json'),
            JSON.stringify(input, null, 2) + '\n', { flag: 'wx' });
          NODE
      - name: Measure retained legacy compiler owners
        id: compiler-baseline
        if: ${{ !cancelled() && steps.compiler-input.outcome == 'success' }}
        working-directory: tests/test-e2e
        env:
          TTSC_E2E_TRACE: ${{ runner.temp }}/e2e-compiler-comparison
          TTSC_TEST_CACHE_DIR: ${{ runner.temp }}/e2e-compiler-cache
          TTSC_CACHE_DIR: ${{ runner.temp }}/e2e-compiler-cache
          TTSC_TEST_DIRS: features/ttsc/api/test_ttsccompiler_plugin_free_compile_and_transform_share_one_project.ts,features/ttsc/compiler/test_compiler_shared_program_preserves_emit_and_diagnostic_boundaries.ts,features/ttsc/api/test_compilerusescasesensitivefilenames_answers_what_the_compiler_reports.ts,features/ttsc/api/test_factory_jsx_strings_roundtrip_through_native_compile.ts
        run: node --disable-warning=ExperimentalWarning --experimental-strip-types --import ../../config/register-typescript-loader.mjs src/measureLegacyE2e.ts
      - name: Bind actual retained baseline report
        id: compiler-baseline-report
        if: ${{ !cancelled() && steps.compiler-baseline.outcome != 'skipped' }}
        env:
          TTSC_E2E_TRACE: ${{ runner.temp }}/e2e-compiler-comparison
        run: &bind-measurement-baseline |
          node <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const path = require('node:path');
          const root = process.env.TTSC_E2E_TRACE;
          const reports = fs.readdirSync(root).filter(name => /^legacy-report-[1-9][0-9]*\.json$/.test(name));
          assert.equal(reports.length, 1, 'Exactly one actual baseline report is required');
          const inputFile = path.join(root, 'measurement-input.json');
          fs.copyFileSync(inputFile, path.join(root, 'legacy-measurement-input.json'), fs.constants.COPYFILE_EXCL);
          const input = JSON.parse(fs.readFileSync(inputFile, 'utf8'));
          input.baselineReport = path.join(root, reports[0]);
          input.boundaries.find(boundary => boundary.boundary === 'selected-runner').data.runner = 'consolidated-index';
          fs.writeFileSync(inputFile, JSON.stringify(input, null, 2) + '\n');
          NODE
      - name: Measure consolidated compiler subset
        if: ${{ !cancelled() && steps.compiler-baseline-report.outcome == 'success' }}
        working-directory: tests/test-e2e
        env:
          TTSC_E2E_TRACE: ${{ runner.temp }}/e2e-compiler-comparison
          TTSC_TEST_CACHE_DIR: ${{ runner.temp }}/e2e-compiler-cache
          TTSC_CACHE_DIR: ${{ runner.temp }}/e2e-compiler-cache
          TTSC_TEST_DIRS: features/ttsc/api/test_ttsccompiler_plugin_free_compile_and_transform_share_one_project.ts,features/ttsc/compiler/test_compiler_shared_program_preserves_emit_and_diagnostic_boundaries.ts,features/ttsc/api/test_compilerusescasesensitivefilenames_answers_what_the_compiler_reports.ts,features/ttsc/api/test_factory_jsx_strings_roundtrip_through_native_compile.ts
        run: node --disable-warning=ExperimentalWarning --experimental-strip-types --import ../../config/register-typescript-loader.mjs src/measureLegacyE2e.ts --consolidated --family=compiler
      - name: Retain actual compiler comparison observations
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: e2e-compiler-comparison-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/e2e-compiler-comparison
          if-no-files-found: error
      - name: Prepare Runtime subset measurement inputs
        id: runtime-input
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env: &runtime-measurement-env
          TTSC_E2E_TRACE: ${{ runner.temp }}/e2e-runtime-comparison
          TTSC_TEST_CACHE_DIR: ${{ runner.temp }}/e2e-runtime-cache
          TTSC_CACHE_DIR: ${{ runner.temp }}/e2e-runtime-cache
          E2E_MEASUREMENT_FAMILY: runtime
          E2E_RUNTIME_FIXTURE_ROOTS: '["ttsc/runner_corpus_invalid_tsconfig_prevents_entry_execution/inputs-1","ttsc/ttsx_checks_a_typescript_file_the_program_generates_before_running_it/inputs-1","ttsc/ttsx_classifies_a_node_modules_package_type_over_the_project_module_option/inputs-1","ttsc/ttsx_classifies_module_preserve_as_ecmascript_modules/inputs-1","ttsc/ttsx_classifies_the_entry_by_a_forwarded_module_flag/inputs-1","ttsc/ttsx_compiles_a_required_source_whose_project_lists_no_files/inputs-1","ttsc/ttsx_register_stops_diagnostics_before_entry_effects/inputs-1","ttsc/ttsx_rejects_a_require_without_a_value/inputs-1","ttsc/ttsx_resolves_config_dir_paths_for_an_installed_package_root/inputs-1","ttsc/ttsx_runs_a_source_file_the_entry_generates_at_runtime/inputs-1","ttsc/ttsx_runs_the_entry_as_the_main_module/inputs-1","ttsc/ttsx_selects_the_project_through_the_legacy_uppercase_p_flag/inputs-1","ttsc/ttsx_emits_an_installed_package_root_whose_config_sets_no_emit_on_error/inputs-1","ttsc/ttsx_builds_a_dependency_whose_config_sets_no_emit_on_error/inputs-1","ttsc/ttsx_commonjs_require_rescues_a_js_specifier_inside_a_dynamic_import/inputs-1","ttsc/ttsx_exposes_a_package_star_export_by_its_own_names_beside_a_same_named_project_file/inputs-1","ttsc/ttsx_classifies_a_symlinked_entry_from_the_target_package_type","ttsc/ttsx_runs_a_dependency_with_a_circular_module_graph","ttsc/ttsx_virtual_layout_mirrors_a_file_symlink_project_entry","ttsc/ttsx_runs_an_entry_that_is_itself_a_symlink","ttsc/ttsx_forwarded_output_flags_create_nothing_in_the_project","ttsc/ttsx_ttsc_cache_dir_relocates_the_runtime_cache","ttsc/ttsx_runs_an_entry_the_project_include_excludes","ttsc/ttsx_stops_on_a_type_error_in_a_required_source_no_checked_build_covered","ttsc/ttsx_standard_decorator_orphans_expose_reexported_const_enums/inputs-1","ttsc/ttsx_decorator_orphan_reexports_honor_the_owning_project/inputs-1","ttsc/ttsx_decorated_barrels_keep_nested_exports_with_emit_options/inputs-1","ttsc/ttsx_compiles_and_checks_a_typescript_preload_outside_include/inputs-1","ttsc/ttsx_compiles_and_checks_a_typescript_preload_outside_include/inputs-2","ttsc/ttsx_refuses_build_options_before_a_javascript_entry/inputs-1","ttsc/ttsx_forwards_an_unknown_flag_to_tsgo/inputs-1","ttsc/ttsx_reports_a_type_error_in_an_entry_the_project_include_excludes/inputs-1","ttsc/ttsx_runs_an_excluded_entry_under_the_project_compiler_options/inputs-1"]'
          TTSC_TEST_DIRS: features/ttsc/ttsx-runtime/test_commonjs_runtime_corpus_preserves_source_ownership_across_project_profiles.ts,features/ttsc/ttsx-runtime/test_ttsx_standard_decorators_honor_response_file_options.ts,features/ttsc/ttsx-runtime/test_ttsx_executes_standard_decorators_at_esnext.ts,features/ttsc/ttsx-runtime/test_ttsx_standard_decorators_preserve_member_initialization.ts,features/ttsc/ttsx-runtime/test_ttsx_runs_preserved_jsx_through_the_automatic_runtime.ts,features/ttsc/ttsx-runtime/test_ttsx_compiles_a_forwarded_jsx_preserve_for_the_runtime.ts,features/ttsc/ttsx-runtime/test_ttsx_standard_decorators_reject_invalid_programs_before_effects.ts,features/ttsc/ttsx-runtime/test_ttsx_standard_decorators_preserve_cli_and_library_options.ts,features/ttsc/ttsx-runtime/test_ttsx_decorator_export_discovery_never_removes_runtime_values.ts,features/ttsc/ttsx-runtime/test_ttsx_register_executes_excluded_standard_decorators.ts,features/ttsc/ttsx-runtime/test_ttsx_register_stops_diagnostics_before_entry_effects.ts,features/ttsc/ttsx-runtime/test_ttsx_rejects_a_require_without_a_value.ts,features/ttsc/ttsx-runtime/test_ttsx_classifies_module_preserve_as_ecmascript_modules.ts,features/ttsc/ttsx-runtime/test_ttsx_classifies_the_entry_by_a_forwarded_module_flag.ts,features/ttsc/ttsx-runtime/test_ttsx_classifies_a_node_modules_package_type_over_the_project_module_option.ts,features/ttsc/ttsx-runtime/test_runner_corpus_invalid_tsconfig_prevents_entry_execution.ts,features/ttsc/ttsx-runtime/test_ttsx_compiles_a_required_source_whose_project_lists_no_files.ts,features/ttsc/ttsx-runtime/test_ttsx_emits_an_installed_package_root_whose_config_sets_no_emit_on_error.ts,features/ttsc/ttsx-runtime/test_ttsx_builds_a_dependency_whose_config_sets_no_emit_on_error.ts,features/ttsc/ttsx-runtime/test_ttsx_follows_directory_references_nested_solutions_and_cycles.ts,features/ttsc/ttsx-runtime/test_ttsx_selects_the_project_through_the_legacy_uppercase_p_flag.ts,features/ttsc/ttsx-runtime/test_ttsx_resolves_config_dir_paths_for_an_installed_package_root.ts,features/ttsc/ttsx-runtime/node-compatibility/test_ttsx_runs_the_entry_as_the_main_module.ts,features/ttsc/ttsx-runtime/test_ttsx_runs_preserved_jsx_in_a_dependency_and_an_orphan.ts,features/ttsc/ttsx-runtime/test_ttsx_checks_a_typescript_file_the_program_generates_before_running_it.ts,features/ttsc/ttsx-runtime/test_ttsx_runs_a_source_file_the_entry_generates_at_runtime.ts,features/ttsc/ttsx-runtime/test_ttsx_preserves_custom_node_builtin_remaps.ts,features/ttsc/ttsx-runtime/test_ttsx_runs_a_dependency_source_its_project_omits_with_that_project_options.ts,features/ttsc/ttsx-runtime/node-compatibility/test_ttsx_commonjs_require_rescues_a_js_specifier_inside_a_dynamic_import.ts,features/ttsc/ttsx-runtime/node-compatibility/test_ttsx_gives_a_javascript_commonjs_module_an_import_reaches_nodes_require.ts,features/ttsc/ttsx-runtime/test_ttsx_exposes_a_package_star_export_by_its_own_names_beside_a_same_named_project_file.ts,features/ttsc/ttsx-runtime/node-compatibility/test_ttsx_classifies_module_node20_from_the_package_type.ts,features/ttsc/ttsx-runtime/test_ttsx_classifies_a_symlinked_entry_from_the_target_package_type.ts,features/ttsc/ttsx-runtime/node-compatibility/test_ttsx_keeps_a_commonjs_entry_the_main_module_under_an_import_preload.ts,features/ttsc/ttsx-runtime/node-compatibility/test_ttsx_runs_a_dependency_with_a_circular_module_graph.ts,features/ttsc/ttsx-runtime/test_ttsx_virtual_layout_mirrors_a_file_symlink_project_entry.ts,features/ttsc/ttsx-runtime/test_ttsx_runs_an_entry_that_is_itself_a_symlink.ts,features/ttsc/ttsx-runtime/test_ttsx_keeps_a_forwarded_inline_source_map.ts,features/ttsc/ttsx-runtime/node-compatibility/test_ttsx_coverage_maps_preserve_entry_and_dependency_sources_in_shared_hosts.ts,features/ttsc/ttsx-runtime/node-compatibility/test_ttsx_stack_maps_preserve_entry_and_dependency_positions_in_shared_hosts.ts,features/ttsc/ttsx-runtime/test_ttsx_forwarded_output_flags_create_nothing_in_the_project.ts,features/ttsc/ttsx-runtime/test_ttsx_ttsc_cache_dir_relocates_the_runtime_cache.ts,features/ttsc/ttsx-runtime/test_ttsx_runs_an_entry_the_project_include_excludes.ts,features/ttsc/ttsx-runtime/node-compatibility/test_ttsx_preloads_every_require_spelling_before_the_entry.ts,features/ttsc/ttsx-runtime/test_ttsx_lets_a_javascript_entry_under_an_import_preload_require_typescript.ts,features/ttsc/ttsx-runtime/test_ttsx_stops_on_a_type_error_in_a_required_source_no_checked_build_covered.ts,features/ttsc/ttsx-runtime/test_ttsx_standard_decorators_in_orphans_keep_the_requested_source.ts,features/ttsc/ttsx-runtime/test_ttsx_standard_decorator_orphans_expose_reexported_const_enums.ts,features/ttsc/ttsx-runtime/test_ttsx_standard_decorators_in_orphans_do_not_cache_imported_values.ts,features/ttsc/ttsx-runtime/test_ttsx_decorator_orphan_reexports_honor_the_owning_project.ts,features/ttsc/ttsx-runtime/test_ttsx_decorated_barrels_keep_nested_exports_with_emit_options.ts,features/ttsc/ttsx-runtime/test_ttsx_decorated_barrels_share_native_export_and_inert_text_connections.ts,features/ttsc/ttsx-runtime/test_ttsx_compiles_and_checks_a_typescript_preload_outside_include.ts,features/ttsc/ttsx-runtime/test_ttsx_refuses_build_options_before_a_javascript_entry.ts,features/ttsc/ttsx-runtime/test_ttsx_forwards_an_unknown_flag_to_tsgo.ts,features/ttsc/ttsx-runtime/test_ttsx_reports_a_type_error_in_an_entry_the_project_include_excludes.ts,features/ttsc/ttsx-runtime/test_ttsx_runs_an_excluded_entry_under_the_project_compiler_options.ts,features/ttsc/ttsx-runtime/test_ttsx_reports_a_missing_entry_before_program_execution.ts
        run: *prepare-measurement-input
      - name: Measure retained legacy Runtime owners
        id: runtime-baseline
        if: ${{ !cancelled() && steps.runtime-input.outcome == 'success' }}
        working-directory: tests/test-e2e
        env: *runtime-measurement-env
        run: node --disable-warning=ExperimentalWarning --experimental-strip-types --import ../../config/register-typescript-loader.mjs src/measureLegacyE2e.ts
      - name: Bind actual retained Runtime baseline report
        id: runtime-baseline-report
        if: ${{ !cancelled() && steps.runtime-baseline.outcome != 'skipped' }}
        env:
          TTSC_E2E_TRACE: ${{ runner.temp }}/e2e-runtime-comparison
        run: *bind-measurement-baseline
      - name: Measure consolidated Runtime subset
        if: ${{ !cancelled() && steps.runtime-baseline-report.outcome == 'success' }}
        working-directory: tests/test-e2e
        env: *runtime-measurement-env
        run: node --disable-warning=ExperimentalWarning --experimental-strip-types --import ../../config/register-typescript-loader.mjs src/measureLegacyE2e.ts --consolidated --family=runtime
      - name: Retain actual Runtime comparison observations
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: e2e-runtime-comparison-${{ github.run_id }}-${{ github.run_attempt }}
