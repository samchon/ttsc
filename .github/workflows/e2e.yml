name: e2e

on: pull_request

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Set shared Go object cache environment
        shell: bash
        run: |
          shared_go_cache="${RUNNER_TEMP}/e2e-shared-go-object-cache"
          printf 'GOCACHE=%s\nTTSC_GO_CACHE_DIR=%s\n' "$shared_go_cache" "$shared_go_cache" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.6.4
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: pnpm
      - uses: actions/setup-go@v7
        id: go
        with:
          go-version-file: packages/ttsc/go.mod
          cache: false
      - name: Locate Go caches
        id: go-cache
        shell: bash
        run: |
          printf 'modules=%s\n' "$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
          printf 'objects=%s\n' "$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
          printf 'image=%s\n' "${ImageOS:-default}" >> "$GITHUB_OUTPUT"
          printf 'node-arch=%s\n' "$(node -p process.arch)" >> "$GITHUB_OUTPUT"
      - name: Restore Go modules and objects
        id: go-objects
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ steps.go-cache.outputs.modules }}
            ${{ steps.go-cache.outputs.objects }}
          key: ttsc-go-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.go-cache.outputs.image }}-${{ steps.go.outputs.go-version }}-${{ github.workflow }}-${{ matrix.name || 'host' }}-${{ hashFiles('**/*.go', '**/go.mod', '**/go.sum', '**/go.work', '**/go.work.sum', 'packages/ttsc/build/**', 'packages/ttsc/driver/resolutioninputs/recorder.cjs', 'packages/ttsc/test/driver/fixtures/rewrite-runtime/**', 'packages/lint/linthost/polyfill_data_gen.json', 'packages/lint/linthost/rule_codes.json', 'pnpm-lock.yaml', '.github/workflows/e2e.yml') }}
          restore-keys: |
            ttsc-go-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.go-cache.outputs.image }}-${{ steps.go.outputs.go-version }}-${{ github.workflow }}-${{ matrix.name || 'host' }}-
            ttsc-go-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.go-cache.outputs.image }}-${{ steps.go.outputs.go-version }}-
            setup-go-${{ runner.os }}-${{ steps.go-cache.outputs.node-arch }}-${{ runner.os == 'Linux' && format('{0}-', steps.go-cache.outputs.image) || '' }}go-${{ steps.go.outputs.go-version }}-
      - run: pnpm install --frozen-lockfile
      - uses: oven-sh/setup-bun@v2
      - run: npm install --global yarn
      - run: pnpm run build
        id: build
      - run: pnpm test:e2e
      - name: Save Built Go Modules and Objects
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.go-objects.outputs.cache-primary-key != '' && steps.go-objects.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ steps.go-cache.outputs.modules }}
            ${{ steps.go-cache.outputs.objects }}
          key: ${{ steps.go-objects.outputs.cache-primary-key }}

