name: e2e

on: pull_request

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Set shared Go object cache environment
        shell: bash
        run: |
          shared_go_cache="${RUNNER_TEMP}/e2e-shared-go-object-cache"
          printf 'GOCACHE=%s\nTTSC_GO_CACHE_DIR=%s\n' "$shared_go_cache" "$shared_go_cache" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.6.4
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: pnpm
      - uses: actions/setup-go@v7
        with:
          go-version-file: packages/ttsc/go.mod
          cache-dependency-path: "**/go.sum"
      - run: pnpm install --frozen-lockfile
      - uses: oven-sh/setup-bun@v2
      - run: npm install --global yarn
      - run: pnpm run build
        id: build
      - run: pnpm test:e2e
