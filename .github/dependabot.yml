version: 2

updates:
  # Dependabot uses the npm ecosystem key for pnpm and pnpm-workspace catalogs.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
    groups:
      typescript-go:
        patterns:
          - "typescript"
      routine-dependencies:
        patterns:
          - "*"
        exclude-patterns:
          - "typescript"
    labels:
      - "dependencies"
    commit-message:
      prefix: "deps"
    open-pull-requests-limit: 25
