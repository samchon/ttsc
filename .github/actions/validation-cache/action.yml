name: Validation caches
description: Persist dependency stores, Go objects and keyed source plugins
inputs:
  group:
    description: Physical validation group
    required: true
  save-go:
    description: One owner per OS and architecture saves the common Go objects
    default: "false"
  go-group:
    description: Namespace for distinct complete Go build inventories
    default: common
runs:
  using: composite
  steps:
    - id: paths
      shell: bash
      run: |
        echo "modules=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
        echo "store=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
        echo "version=$(go env GOVERSION)" >> "$GITHUB_OUTPUT"
    - uses: actions/cache@v5
      with:
        path: |
          ${{ steps.paths.outputs.modules }}
          ${{ steps.paths.outputs.store }}
        key: validation-deps-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.paths.outputs.version }}-${{ hashFiles('pnpm-lock.yaml', '**/go.sum') }}
    - uses: actions/cache@v5
      if: inputs.save-go == 'true'
      with:
        path: ${{ env.GOCACHE }}
        key: validation-go-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.paths.outputs.version }}-${{ inputs.go-group }}-${{ hashFiles('packages/**/*.go', 'packages/**/go.mod', 'packages/**/go.sum', 'tests/**/*.go', 'tests/go-transformer/**', 'scripts/test-go*.cjs', 'scripts/ci/go-test-overlay.cjs') }}
        restore-keys: |
          validation-go-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.paths.outputs.version }}-${{ inputs.go-group }}-
    - uses: actions/cache/restore@v5
      if: inputs.save-go != 'true'
      with:
        path: ${{ env.GOCACHE }}
        key: validation-go-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.paths.outputs.version }}-${{ inputs.go-group }}-${{ hashFiles('packages/**/*.go', 'packages/**/go.mod', 'packages/**/go.sum', 'tests/**/*.go', 'tests/go-transformer/**', 'scripts/test-go*.cjs', 'scripts/ci/go-test-overlay.cjs') }}
        restore-keys: |
          validation-go-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.paths.outputs.version }}-${{ inputs.go-group }}-
    - uses: actions/cache@v5
      if: env.TTSC_TEST_CACHE_DIR != ''
      with:
        path: ${{ env.TTSC_TEST_CACHE_DIR }}
        # Source plugins already carry content/toolchain keys. Persist additions
        # separately so each suite does not upload the same large Go object tree.
        key: validation-plugins-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.paths.outputs.version }}-${{ inputs.group }}-${{ github.sha }}
        restore-keys: |
          validation-plugins-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.paths.outputs.version }}-${{ inputs.group }}-
          validation-plugins-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.paths.outputs.version }}-
