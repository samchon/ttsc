packages:
  - "config"
  - "packages/*"
  - "tests/*"
  - "website"
overrides:
  # Next 15.5.22 pins vulnerable PostCSS 8.4.31. Keep the override on that
  # parent edge; the website production build verifies the PostCSS 8 API.
  "next@15.5.22>postcss": 8.5.23
  # Sharp's patched line starts at 0.35.0, outside Next's ^0.34.3 optional
  # range. Scope that compatibility exception to Next and verify every static
  # export in the website production build.
  "next@15.5.22>sharp": 0.35.0
catalogs:
  typescript:
    typescript: ^7.0.2
    # Native TypeScript 7 drops the classic JS compiler API, so the legacy v6
    # compiler is retained under the `ts-legacy` alias for
    # `@rollup/plugin-typescript`, `typescript-eslint`, and the factory parity
    # oracle.
    ts-legacy: "npm:typescript@~6.0.3"
  rollup:
    "@rollup/plugin-commonjs": ^29.0.0
    "@rollup/plugin-node-resolve": ^16.0.3
    rollup: ^4.56.0
  samchon:
    typia: &typia 13.2.0
    "@typia/interface": *typia
    "@typia/mcp": *typia
    "@typia/utils": *typia
  utils:
    "@nestia/e2e": ^12.0.0
    "@types/node": ^25.3.0
    rimraf: ^6.1.2
