packages:
  - "config"
  - "benchmarks/*"
  - "packages/*"
  - "packages/lint/test/lint-contributor-demo"
  - "tests/*"
  - "website"
overrides:
  # Patch releases retain each installed major's API while clearing the
  # severe advisories reported by the locked dependency graph.
  "undici@7.29.0": 7.29.1
  "brace-expansion@2.1.4": 2.1.6
  "brace-expansion@5.0.9": 5.0.11
  "next@16.3.4": 16.3.6
  # mathjax-full pins speech-rule-engine 4, which pins this vulnerable exact
  # version; Marp and Nextra do not yet have released upgrade paths to v5.
  "@xmldom/xmldom": 0.9.12
catalogs:
  typescript:
    typescript: ^7.0.2
    # Native TypeScript 7 drops the classic JS compiler API, so the legacy v6
    # compiler is retained under the `ts-legacy` alias for
    # `@rollup/plugin-typescript`, `typescript-eslint`, and the factory parity
    # oracle.
    ts-legacy: "npm:typescript@~6.0.3"
  rollup:
    "@rollup/plugin-commonjs": ^29.0.0
    "@rollup/plugin-node-resolve": ^16.0.3
    rollup: ^4.56.0
  samchon:
    "@wrtnlabs/evidence": ^0.3.1
    nestia: &nestia ^14.0.0
    "@nestia/core": *nestia
    "@nestia/fetcher": *nestia
    "@nestia/sdk": *nestia
    typia: &typia ^15.1.0
    "@typia/interface": *typia
    "@typia/mcp": *typia
    "@typia/utils": *typia
  prisma:
    # Pinned exactly: Prisma publishes this package under an engine-hash version
    # rather than a semver range, so a caret would express nothing. The evidence
    # bridge prefers a copy resolvable from the consumer's own project and falls
    # back to this one, so the pin decides the default parser, not the only one.
    "@prisma/prisma-schema-wasm": 7.10.0-2.d0368e25c88e68caa4d283b5f2d88d1b76ed9356
  utils:
    "@nestia/e2e": ^14.0.0
    "@types/node": ^25.3.0
    rimraf: ^6.1.2
    yaml: ^2.9.0
