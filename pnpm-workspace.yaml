packages:
  - "config"
  - "benchmarks/*"
  - "packages/*"
  - "tests/*"
  - "website"
# A peer dependency is the consumer's to supply, and pnpm installs one here only
# because its default changed in v8. `packages/metro` declares its three Metro
# and Expo transformers as optional peers, which is what they are, and pnpm
# installs them anyway; `peerDependenciesMeta.optional` does not exempt them.
autoInstallPeers: false
# Mocha 11 still ranges over serialize-javascript 6, whose serializer has a
# code-injection advisory. Its public call shape is unchanged in the patched
# release, so keep the real Mocha register defense without accepting that edge.
overrides:
  "mocha>serialize-javascript": 7.0.3
catalogs:
  typescript:
    typescript: ^7.0.2
    # Native TypeScript 7 drops the classic JS compiler API, so the legacy v6
    # compiler is retained under the `ts-legacy` alias for
    # `@rollup/plugin-typescript`, `typescript-eslint`, and the factory parity
    # oracle.
    ts-legacy: "npm:typescript@~6.0.3"
  rollup:
    "@rollup/plugin-commonjs": ^29.0.0
    "@rollup/plugin-node-resolve": ^16.0.3
    rollup: ^4.56.0
  samchon:
    nestia: &nestia ^12.1.0
    "@nestia/core": *nestia
    "@nestia/fetcher": *nestia
    "@nestia/sdk": *nestia
    typia: &typia 14.0.0
    "@typia/interface": *typia
    "@typia/mcp": *typia
    "@typia/utils": *typia
  prisma:
    # Pinned exactly: Prisma publishes this package under an engine-hash version
    # rather than a semver range, so a caret would express nothing. The evidence
    # bridge prefers a copy resolvable from the consumer's own project and falls
    # back to this one, so the pin decides the default parser, not the only one.
    "@prisma/prisma-schema-wasm": 7.10.0-2.d0368e25c88e68caa4d283b5f2d88d1b76ed9356
  utils:
    "@nestia/e2e": ^12.0.0
    "@types/node": ^25.3.0
    rimraf: ^6.1.2
    yaml: ^2.9.0
