packages:
  - "config"
  - "benchmarks/*"
  - "packages/*"
  - "tests/*"
  - "website"
overrides:
  # VSCE's compatible tmp range selected 0.2.6, which is vulnerable to a
  # type-confusion path traversal. Keep its transitive edge on the patched line.
  "@vscode/vsce@3.9.2>tmp": 0.2.7
  # The import sorter supports minimatch's stable named API, but its declared
  # v9 range cannot reach the brace-expansion 5.0.8 allocation-bound fix.
  "@trivago/prettier-plugin-sort-imports@6.0.2>minimatch": 10.2.5
  # Next 15.5.22 pins vulnerable PostCSS 8.4.31. Keep the override on that
  # parent edge; the website production build verifies the PostCSS 8 API.
  "next@15.5.22>postcss": 8.5.23
  # Sharp's patched line starts at 0.35.0, outside Next's ^0.34.3 optional
  # range. Scope that compatibility exception to Next and verify every static
  # export in the website production build.
  "next@15.5.22>sharp": 0.35.0
  # js-yaml before 4.3.1 resolves `!!omap` in quadratic time. Every dependent
  # here declares a ^4 range, so the patched line needs no parent scope and one
  # entry closes the edge for all of them.
  "js-yaml": ^4.3.1
catalogs:
  typescript:
    typescript: ^7.0.2
    # Native TypeScript 7 drops the classic JS compiler API, so the legacy v6
    # compiler is retained under the `ts-legacy` alias for
    # `@rollup/plugin-typescript`, `typescript-eslint`, and the factory parity
    # oracle.
    ts-legacy: "npm:typescript@~6.0.3"
  rollup:
    "@rollup/plugin-commonjs": ^29.0.0
    "@rollup/plugin-node-resolve": ^16.0.3
    rollup: ^4.56.0
  samchon:
    nestia: &nestia ^12.1.0
    "@nestia/core": *nestia
    "@nestia/fetcher": *nestia
    "@nestia/sdk": *nestia
    typia: &typia 13.2.0
    "@typia/interface": *typia
    "@typia/mcp": *typia
    "@typia/utils": *typia
  prisma:
    # Pinned exactly: Prisma publishes this package under an engine-hash version
    # rather than a semver range, so a caret would express nothing. The evidence
    # bridge prefers a copy resolvable from the consumer's own project and falls
    # back to this one, so the pin decides the default parser, not the only one.
    "@prisma/prisma-schema-wasm": 7.10.0-2.d0368e25c88e68caa4d283b5f2d88d1b76ed9356
  utils:
    "@nestia/e2e": ^12.0.0
    "@types/node": ^25.3.0
    rimraf: ^6.1.2
    yaml: ^2.9.0
