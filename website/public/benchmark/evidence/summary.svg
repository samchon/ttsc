<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title description" viewBox="0 0 1440 1474" width="1440" height="1474">
<title id="title">Benchmark: Plain against Evidence</title>
<desc id="description">Coverage of the provenance graph per subject, then token spend per subject with stacked shades for backend development and review, frontend development and review, and overall review. Work time and API cost read beside each bar.</desc>
