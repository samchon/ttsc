</style>
<rect width="1440" height="1434" fill="#ffffff"/>
<text x="36" y="38" class="title">Benchmark: Plain against Evidence</text>
<text x="36" y="62" class="subtitle">Coverage is higher-is-better. Token spend is lower-is-better and shares one axis across subjects; stacked shades show development and review phases, and work time and cost sit beside each bar.</text>
<rect x="36" y="80" width="18" height="12" rx="3" fill="#4c78a8" fill-opacity="0.44"/>
<text x="62" y="91" class="legend-label">Backend Dev</text>
