<text x="62" y="151" class="legend-label">Frontend Review</text>
<text x="212" y="151" class="legend">The same loop until dry over the frontend, gated on live reloads rather than a build</text>
<rect x="36" y="160" width="18" height="12" rx="3" fill="#4c78a8" fill-opacity="1"/>
<text x="62" y="171" class="legend-label">Overall Review</text>
<text x="212" y="171" class="legend">Both layers and the live journeys together, loop until dry, then the closing gates</text>
