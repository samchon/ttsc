<text x="36" y="386" class="table-note">Coverage composes thirteen reference-graph edges so serial hops multiply and branches average; each edge&apos;s population is in the aggregate.</text>
<text x="36" y="401" class="table-note">Evidence is complete by construction: the compiler rejects a missing edge, so nothing is counted.</text>
